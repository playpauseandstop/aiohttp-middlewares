# Build system
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#declaring-build-system-dependencies-the-build-system-table
[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.8,<0.13.0" ]

# Project metadata
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#declaring-project-metadata-the-project-table
[project]
name = "aiohttp-middlewares"
version = "2.4.0"
description = "Collection of useful middlewares for aiohttp applications."
readme = "README.rst"
keywords = [ "aiohttp", "aiohttp-middlewares", "aiohttp-server", "middlewares" ]
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [
  { name = "Igor Davydenko", email = "iam@igordavydenko.com" },
]
requires-python = ">=3.10,<4.0"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: aiohttp",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
  "Topic :: Utilities",
  "Typing :: Typed"
]
dependencies = [
  "aiohttp>=3.11.0,<4.0.0",
  "async-timeout>=4.0.2,<6.0.0",
  "yarl>=1.17.0,<2.0.0",
]
[project.urls]
"Bug Tracker" = "https://github.com/playpauseandstop/aiohttp-middlewares/issues"
homepage = "https://igordavydenko.com/projects.html#aiohttp-middlewares"
repository = "https://github.com/playpauseandstop/aiohttp-middlewares"
documentation = "https://aiohttp-middlewares.readthedocs.io/"

[dependency-groups]
dev = [
  "mypy>=2.3.1,<3.0.0",
]
test = [
  "coverage>=7.10.3,<8.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-aiohttp>=1.1.0,<2.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
]
docs = [
  "furo>=2025.7.19,<2026.0.0",
  "sphinx>=8.1.3,<9.0.0",
  "sphinx-autobuild>=2024.10.3,<2025.0.0",
  "sphinx-autodoc-typehints>=3.0.1,<4.0.0",
  "sphinx-copybutton>=0.5.2,<0.6.0",
  "sphinxext-opengraph>=0.7.5,<0.8.0",
]

# uv configuration
# https://docs.astral.sh/uv/concepts/configuration-files/
[tool.uv]
required-version = ">=0.11.8"
default-groups = [ "dev", "test", "docs" ]
add-bounds = "major"

# black configuration
# https://black.readthedocs.io/en/stable/usage_and_configuration/the_basics.html#configuration-via-a-file
[tool.black]
line_length = 79
target_version = [ "py310" ]

# isort configuration
# https://pycqa.github.io/isort/docs/configuration/config_files.html#pyprojecttoml-preferred-format
[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true
lines_between_types = 0
combine_as_imports = true
src_paths = [ "src/" ]
virtual_env = ".venv/"

# pyproject-fmt configuration
# https://pyproject-fmt.readthedocs.io/en/latest/configuration.html
[tool.pyproject-fmt]
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
collapse_tables = [ "project.authors" ]

# mypy configuration
# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
mypy_path = "src/"
exclude = [ "docs/", "migrations/", "tests/" ]
python_version = "3.14"
disallow_any_decorated = true
strict = true
show_column_numbers = true
show_error_codes = true

# pytest configuration
# https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml
[tool.pytest.ini_options]
minversion = "8.4.2"
testpaths = [ "tests/" ]
addopts = "--cov --no-cov-on-fail"
log_level = "info"
# Local settings
asyncio_mode = "auto"

# coverage configuration
# https://coverage.readthedocs.io/en/latest/config.html#toml-syntax
[tool.coverage.run]
branch = true
source = [ "aiohttp_middlewares" ]
[tool.coverage.paths]
source = [ "src/" ]
[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
]
omit = [
  "src/*/__main__.py",
  "src/*/annotations.py",
]
fail_under = 95
skip_covered = true
show_missing = true

# tox configuration
# https://tox.wiki/en/stable/reference/config.html#pyproject-toml-ini
[tool.tox]
legacy_tox_ini = """

[tox]
envlist = py310,py310-minimum-requirements,py311,py312,py313,py314

[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314

[testenv]
passenv =
  PYTEST_ADDOPTS
runner = uv-venv-lock-runner
commands =
  python -m pytest

[testenv:py310-minimum-requirements]
commands_pre =
  uv pip install aiohttp==3.11.0 async-timeout==4.0.2 yarl==1.17.0
"""

# badabump configuration
# https://github.com/playpauseandstop/badabump
[tool.badabump]
version_type = "semver"
