version: 2

updates:
  # Maintain Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 25
    # uv must run build backends to resolve uv.lock
    insecure-external-code-execution: "allow" # zizmor: ignore[dependabot-execution]
    groups:
      dependencies:
        dependency-type: "production"
      dev-dependencies:
        dependency-type: "development"
    cooldown:
      default-days: 7

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/**/*"
    schedule:
      interval: "monthly"
      time: "05:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    groups:
      ci-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7
