version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
  jobs:
    post_create_environment:
      # Install uv
      - "curl -LsSf https://astral.sh/uv/install.sh | sh"
    post_install:
      # Generate requirements.txt file
      - "${HOME}/.local/bin/uv export --format requirements.txt --frozen --no-hashes --no-default-groups --group=docs --no-emit-project -o ${READTHEDOCS_VERSION}.txt"
      # Install project and docs dependencies from generated requirements file
      - "python -m pip install -r ${READTHEDOCS_VERSION}.txt"

sphinx:
  configuration: "./docs/conf.py"
